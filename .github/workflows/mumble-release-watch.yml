name: Mumble-Release-Watch

# Reports a new Mumble release as an issue, including a diff of the two interface files, and starts the live tests
# against it. Taking the release over (interface files, checks) is done locally: say "Update alles" / "update everything"
# in Claude Code (skill .claude/skills/update-all), or run tools/update-mumble-interfaces.sh <tag> by hand.
# Ruumble Desk (ruumble-project/ruumble-client) watches Mumble releases for its own Mumble tag and patch.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare the latest release with what we use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          interfaces="$(cat third_party/mumble/VERSION)"
          latest="$(gh api repos/mumble-voip/mumble/releases/latest --jq .tag_name)"
          echo "interfaces $interfaces, latest release $latest"
          newest="$(printf '%s\n%s\n' "$interfaces" "$latest" | sort -V | tail -1)"
          if [[ "$latest" == "$interfaces" ]] || [[ "$newest" != "$latest" ]]; then exit 0; fi

          title="Mumble $latest available (we use $interfaces)"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue already exists."; exit 0
          fi

          cp -r third_party/mumble /tmp/before
          tools/update-mumble-interfaces.sh "$latest" > /dev/null
          diff -ru --exclude=VERSION --exclude=SHA256SUMS --exclude=README.md /tmp/before third_party/mumble > /tmp/interfaces.diff || true

          {
            echo "A new Mumble release is available: **$latest** (interface files $interfaces)."
            echo
            echo "To take it over: say **\"Update alles\"** in Claude Code in this repo (skill \`.claude/skills/update-all\`), or run \`tools/update-mumble-interfaces.sh $latest\` by hand. Then check \`docs/mumble-interfaces.md\` against the changes. The live tests were started for this release (workflow live.yml)."
            echo
            if [[ -s /tmp/interfaces.diff ]]; then
              echo "<details><summary>Changes to the interface files</summary>"
              echo
              echo '```diff'
              head -c 60000 /tmp/interfaces.diff
              echo '```'
              echo "</details>"
            else
              echo "The interface files are unchanged."
            fi
          } > /tmp/body.md
          gh issue create --title "$title" --body-file /tmp/body.md
          # Check behaviour, not just the interfaces: live tests against the new release
          gh workflow run live.yml -f mumble="$latest" || echo "Could not start the live tests"
